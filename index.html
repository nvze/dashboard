<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- PERBAIKAN 1: Menghapus pembatasan zoom yang kaku -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>imnxx Dashboard</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2855c9">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NvZE">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    /* Reset & Base Style */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden; /* Mengunci layar agar tidak bisa di-scroll */
    }

    body {
      font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #2855c9; 
      background-image: linear-gradient(135deg, #ff9aeb 0%, #2855c9 40%, #2855c9 60%, #ff9aeb 100%);
      color: #ffffff;
      
      padding: 0.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      gap: 0.5rem; 
      margin: auto;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      animation: fadeInDown 0.8s ease-out;
    }

    .profile-logo {
      width: 65px; /* Diperkecil agar hemat ruang */
      height: auto;
      display: block;
      filter: brightness(0) invert(1) drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    /* Dashboard Card */
    .dashboard-card {
      width: 100%;
      text-align: center;
      padding: 1rem 0.8rem;
      border-radius: 20px;
      
      background: rgba(255, 255, 255, 0.1); 
      backdrop-filter: blur(20px);            
      -webkit-backdrop-filter: blur(20px);
      
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.1rem;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      color: #dbeafe; 
      margin-bottom: 0.6rem;
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.9;
    }

    /* Widget Jam */
    .clock-widget {
      margin-bottom: 0.8rem;
    }
    
    .time-display {
      font-size: 2.2rem;
      font-weight: 600; 
      color: #ffffff; 
      line-height: 1;
      margin-bottom: 0.1rem;
      letter-spacing: -1px;
    }

    .date-display {
      font-size: 0.75rem;
      color: #e2e8f0;
      font-weight: 500;
    }
    
    /* List Menu */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
    }

    a.menu-item {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12); 
      padding: 0.55rem 0.8rem; /* Padding tombol dibuat lebih tipis */
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
    }

    a.menu-item:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .item-title {
      font-weight: 600;
      color: #ffffff; 
      font-size: 0.8rem;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- TAMPILAN DESKTOP / TABLET (TETAP PROPORSIONAL) --- */
    @media (min-width: 768px) {
      .main-wrapper {
        max-width: 480px;
        gap: 0.8rem;
      }

      .profile-logo {
        width: 100px;
      }

      .dashboard-card {
        padding: 1.8rem 1.5rem;
      }

      h1 {
        font-size: 1.4rem;
      }

      p.subtitle {
        font-size: 0.9rem;
        margin-bottom: 1.2rem;
      }

      .time-display {
        font-size: 3.2rem;
      }

      .date-display {
        font-size: 0.9rem;
      }

      .menu-list {
        gap: 0.55rem;
      }

      a.menu-item {
        padding: 0.85rem 1rem;
      }

      .item-title {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <div class="logo-container">
      <img src="logo.png" alt="NVZE SYSTEM" class="profile-logo">
    </div>

    <div class="dashboard-card">
      
      <h1>Dashboard</h1>
      <p class="subtitle">Visualisasi Knowledge & Knowhow</p>

      <div class="clock-widget">
        <div class="time-display" id="clock-time">00:00</div>
        <div class="date-display" id="clock-date">Memuat...</div>
      </div>
      
      <div class="menu-list">
        <a href="blog.html" class="menu-item">
          <div class="item-title">Arsip Tulisan</div>
        </a>

        <a href="https://nsebook.vercel.app" class="menu-item">
          <div class="item-title">nseBook</div>
        </a>
        
        <a href="https://nsesystem.vercel.app" class="menu-item">
          <div class="item-title">nseSystem</div>
        </a>

        <a href="https://nsecreate.vercel.app/" class="menu-item">
          <div class="item-title">nseCREATE</div>
        </a>

        <a href="https://nsemarket.vercel.app/update" class="menu-item">
          <div class="item-title">nseMarket</div>
        </a>

        <a href="https://nsestudy.vercel.app" class="menu-item">
          <div class="item-title">nseStudy</div>
        </a>

        <a href="https://nsenotes.vercel.app" class="menu-item">
          <div class="item-title">nseNotes</div>
        </a>
      </div>
    </div>

  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const timeOptions = { hour: '2-digit', minute: '2-digit' };
      const timeString = now.toLocaleTimeString('id-ID', timeOptions).replace('.', ':');
      const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }; 
      const dateString = now.toLocaleDateString('id-ID', dateOptions);

      document.getElementById('clock-time').textContent = timeString;
      document.getElementById('clock-date').textContent = dateString;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker terdaftar!');
          })
          .catch(err => {
            console.log('ServiceWorker gagal!', err);
          });
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>imnxx Dashboard</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0b0a">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NvZE">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    /* Reset & Base Style */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      
      /* --- BACKGROUND UTAMA (OBSIDIAN & ESPRESSO BRONZE) --- */
      background-color: #0d0b0a; 
      background-image: radial-gradient(circle at 15% 15%, #3d2817 0%, #1a120d 45%, #090807 100%);
      
      color: #f5efe6;
      
      /* --- PERBAIKAN TINGGI LAYAR --- */
      height: 100vh;
      height: 100dvh; 
      
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      gap: 0.3rem; 
      padding: 1rem;
      transition: all 0.3s ease;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      width: 100%;
      padding-left: 0.5rem;
      animation: fadeInDown 0.8s ease-out;
    }

    .profile-logo {
      width: 160px !important;
      height: auto;
      display: block;
      /* Sentuhan warna warm champagne/ivory agar menyatu dengan tema mewah */
      filter: brightness(0) invert(0.93) sepia(0.18) saturate(0.8) drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }

    /* --- DASHBOARD CARD (SMOKED GLASS & BRONZE RIM) --- */
    .dashboard-card {
      width: 100%;
      text-align: center;
      padding: 1.2rem 1.2rem;
      border-radius: 24px;
      
      background: linear-gradient(145deg, rgba(36, 26, 20, 0.65) 0%, rgba(14, 11, 9, 0.85) 100%); 
      backdrop-filter: blur(24px);            
      -webkit-backdrop-filter: blur(24px);
      
      border: 1px solid rgba(196, 154, 108, 0.28);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(230, 194, 145, 0.15);
      
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f7f1e8;
      margin-bottom: 0.1rem;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    p.subtitle {
      color: #c49a6c; /* Warm Bronze / Cognac */
      margin-bottom: 1.2rem;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.4px;
      opacity: 0.95;
    }

    /* --- WIDGET JAM --- */
    .clock-widget {
      margin-bottom: 1.5rem;
    }
    
    .time-display {
      font-size: 3rem;
      font-weight: 600; 
      /* Gradasi halus dari Champagne Gold ke Warm Ivory */
      background: linear-gradient(180deg, #ffffff 20%, #d8b892 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 0.25rem;
      letter-spacing: -1px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    .date-display {
      font-size: 0.9rem;
      color: #b5a698;
      font-weight: 500;
    }
    
    /* --- LIST MENU --- */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
    }

    a.menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      background: rgba(255, 245, 235, 0.035); 
      padding: 0.85rem 1.1rem;
      border-radius: 14px;
      border: 1px solid rgba(196, 154, 108, 0.18);
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    a.menu-item:hover {
      background: linear-gradient(135deg, rgba(166, 124, 82, 0.22) 0%, rgba(92, 64, 40, 0.28) 100%);
      border-color: rgba(212, 170, 120, 0.55);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      transform: translateY(-2px);
    }
    
    .item-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .item-title {
      font-weight: 600;
      color: #f3ece4; 
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      transition: color 0.2s ease;
    }

    a.menu-item:hover .item-title {
      color: #e6c291;
    }
    
    .item-desc {
      font-size: 0.7rem;
      color: #a8998c;
      margin-top: 1px;
      opacity: 0.85;
    }

    .item-icon {
      font-size: 1.2rem;
      color: #c49a6c;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-height: 650px) {
      .profile-logo { width: 220px !important; }
      .time-display { font-size: 2.5rem; }
      .clock-widget { margin-bottom: 1rem; }
      .dashboard-card { padding: 1rem; }
    }

    /* ========================================================= */
    /* --- LAYOUT HORIZONTAL KHUSUS DESKTOP / LAPTOP (≥768px) --- */
    /* ========================================================= */
    @media (min-width: 768px) {
      .main-wrapper {
        max-width: 900px;
        flex-direction: column;
        align-items: flex-start;
      }

      .logo-container {
        justify-content: flex-start;
        width: 100%;
      }

      .profile-logo {
        width: 220px; 
      }

      .dashboard-card {
        flex-direction: row;
        align-items: flex-start;
        justify-content: space-between;
        text-align: left;
        padding: 2.5rem;
        gap: 2rem;
      }

      /* Bagian Kiri: Header + Jam */
      .card-left {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
      }

      .card-left h1 {
        font-size: 2rem;
      }

      .card-left p.subtitle {
        font-size: 1rem;
        margin-bottom: 2rem;
      }

      .clock-widget {
        margin-bottom: 0;
      }

      .time-display {
        font-size: 4rem;
      }

      .date-display {
        font-size: 1.1rem;
      }

      /* Bagian Kanan: Grid Menu */
      .menu-list {
        flex: 1.2;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.8rem;
      }

      a.menu-item {
        padding: 1rem 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <div class="logo-container">
      <img src="logo.png" alt="NVZE SYSTEM" class="profile-logo">
    </div>

    <div class="dashboard-card">
      
      <!-- Bagian Kiri (Header + Jam) saat di Desktop -->
      <div class="card-left">
        <h1>Dashboard</h1>
        <p class="subtitle">Visualisasi Knowledge & Knowhow</p>

        <div class="clock-widget">
          <div class="time-display" id="clock-time">00:00</div>
          <div class="date-display" id="clock-date">Memuat...</div>
        </div>
      </div>
      
      <!-- Bagian Kanan (Menu) saat di Desktop -->
      <div class="menu-list">
        <a href="blog.html" class="menu-item">
          <div class="item-content">
            <div class="item-title">Arsip Tulisan</div>
          </div>
        </a>

        <a href="https://nsebook.vercel.app" class="menu-item">
          <div class="item-content">
            <div class="item-title">nseBook</div>
          </div>
        </a>
        
        <a href="https://nsesystem.vercel.app" class="menu-item">
          <div class="item-content">
            <div class="item-title">nseSystem</div>
          </div>
        </a>

        <a href="https://nsecreate.vercel.app/" class="menu-item">
          <div class="item-content">
            <div class="item-title">nseCREATE</div>
          </div>
        </a>

        <a href="https://nsemarket.vercel.app/update" class="menu-item">
          <div class="item-content">
            <div class="item-title">nseMarket</div>
          </div>
        </a>

        <a href="https://studynaze.vercel.app" class="menu-item">
          <div class="item-content">
            <div class="item-title">StudyNaze</div>
          </div>
        </a>

        <a href="https://nsenotes.vercel.app" class="menu-item">
          <div class="item-content">
            <div class="item-title">nseNotes</div>
          </div>
        </a>
      </div>

    </div>

  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const timeOptions = { hour: '2-digit', minute: '2-digit' };
      const timeString = now.toLocaleTimeString('id-ID', timeOptions).replace('.', ':');
      const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }; 
      const dateString = now.toLocaleDateString('id-ID', dateOptions);

      document.getElementById('clock-time').textContent = timeString;
      document.getElementById('clock-date').textContent = dateString;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker terdaftar!');
          })
          .catch(err => {
            console.log('ServiceWorker gagal!', err);
          });
      });
    }
  </script>
</body>
</html>
